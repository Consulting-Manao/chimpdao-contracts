name: Test Contract

permissions:
  contents: read

on:
  push:
    branches: [main]
  # No paths filter: contracts import each other's wasm and share the manifest.
  pull_request:

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  RUSTFLAGS: -C debuginfo=0 # Do not produce debug symbols to keep memory usage down
  RUST_BACKTRACE: 1

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: stellar/actions/rust-cache@main

      - run: rustup update
      - run: rustup component add clippy rustfmt

      # soroban target
      - run: rustup target add wasm32v1-none

      - uses: stellar/stellar-cli@main

      # Must precede cargo test: collection's and the factory's deploy tests import a
      # sibling's built wasm to exercise a real `deploy_v2`.
      - name: Build wasm
        run: make contract_build

      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: cargo fmt --all --check

      - run: cargo test --workspace

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
