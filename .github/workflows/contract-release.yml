name: Publish Chimp contracts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: { }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Environment gate
  approve-release:
    runs-on: ubuntu-latest
    environment: publish-contract
    permissions: { }
    steps:
      - run: echo "Approved release"

  release-collection-contract:
    needs: approve-release
    permissions:
      id-token: write      # OIDC token for build-provenance attestation
      contents: write      # in order to create releases
      attestations: write
    name: Release collection Chimp
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@88068ec50cba931a96436869727ed08edeb76ade
    with:
      release_name: ${{ github.ref_name }}
      release_description: "Chimp collection contract"
      home_domain: 'nft.chimpdao.xyz'
      relative_path: 'contracts/collection'
      package: 'collection'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  release-nfc-nft-contract:
    needs: approve-release
    permissions:
      id-token: write      # OIDC token for build-provenance attestation
      contents: write      # in order to create releases
      attestations: write
    name: Release nfc-nft Chimp
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@88068ec50cba931a96436869727ed08edeb76ade
    with:
      release_name: ${{ github.ref_name }}
      release_description: "Chimp nfc-nft contract"
      home_domain: 'nft.chimpdao.xyz'
      relative_path: 'contracts/nfc-nft'
      package: 'nfc-nft'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  release-prize-contract:
    needs: approve-release
    permissions:
      id-token: write      # OIDC token for build-provenance attestation
      contents: write      # in order to create releases
      attestations: write
    name: Release prize Chimp
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@88068ec50cba931a96436869727ed08edeb76ade
    with:
      release_name: ${{ github.ref_name }}
      release_description: "Chimp prize example contract"
      home_domain: 'nft.chimpdao.xyz'
      relative_path: 'examples/prize'
      package: 'prize'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  release-pocket-contract:
    needs: approve-release
    permissions:
      id-token: write      # OIDC token for build-provenance attestation
      contents: write      # in order to create releases
      attestations: write
    name: Release pocket Chimp
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@88068ec50cba931a96436869727ed08edeb76ade
    with:
      release_name: ${{ github.ref_name }}
      release_description: "Chimp Pocket smart account (per-card purse)"
      home_domain: 'nft.chimpdao.xyz'
      relative_path: 'contracts/pocket'
      package: 'chimpdao-pocket'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  release-pocket-factory-contract:
    needs: approve-release
    permissions:
      id-token: write      # OIDC token for build-provenance attestation
      contents: write      # in order to create releases
      attestations: write
    name: Release pocket-factory Chimp
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@88068ec50cba931a96436869727ed08edeb76ade
    with:
      release_name: ${{ github.ref_name }}
      release_description: "Chimp Pocket account factory"
      home_domain: 'nft.chimpdao.xyz'
      relative_path: 'contracts/pocket-factory'
      package: 'chimpdao-pocket-factory'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}


  # Every holder's durable balance runs under this wasm and the terminal deploys from its
  # hash, so it needs the same reproducible build + provenance attestation as the rest.
  release-account-contract:
    needs: approve-release
    permissions:
      id-token: write      # OIDC token for build-provenance attestation
      contents: write      # in order to create releases
      attestations: write
    name: Release account Chimp
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@88068ec50cba931a96436869727ed08edeb76ade
    with:
      release_name: ${{ github.ref_name }}
      release_description: "Chimp account — cards are the signers"
      home_domain: 'nft.chimpdao.xyz'
      relative_path: 'contracts/account'
      package: 'chimpdao-account'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

