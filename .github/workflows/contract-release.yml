name: Publish Chimp contracts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: { }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Environment gate
  approve-release:
    runs-on: ubuntu-latest
    environment: publish-contract
    permissions: { }
    steps:
      - run: echo "Approved release"

  release-collection-contract:
    needs: approve-release
    permissions:
      id-token: write      # OIDC token for build-provenance attestation
      contents: write      # in order to create releases
      attestations: write
    name: Release collection Chimp
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@88068ec50cba931a96436869727ed08edeb76ade
    with:
      release_name: ${{ github.ref_name }}
      release_description: "Chimp collection contract"
      home_domain: 'nft.chimpdao.xyz'
      relative_path: 'contracts/collection'
      package: 'collection'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  release-nfc-nft-contract:
    needs: approve-release
    permissions:
      id-token: write      # OIDC token for build-provenance attestation
      contents: write      # in order to create releases
      attestations: write
    name: Release nfc-nft Chimp
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@88068ec50cba931a96436869727ed08edeb76ade
    with:
      release_name: ${{ github.ref_name }}
      release_description: "Chimp nfc-nft contract"
      home_domain: 'nft.chimpdao.xyz'
      relative_path: 'contracts/nfc-nft'
      package: 'nfc-nft'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  release-prize-contract:
    needs: approve-release
    permissions:
      id-token: write      # OIDC token for build-provenance attestation
      contents: write      # in order to create releases
      attestations: write
    name: Release prize Chimp
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@88068ec50cba931a96436869727ed08edeb76ade
    with:
      release_name: ${{ github.ref_name }}
      release_description: "Chimp prize example contract"
      home_domain: 'nft.chimpdao.xyz'
      relative_path: 'examples/prize'
      package: 'prize'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  release-smart-account-contract:
    needs: approve-release
    permissions:
      id-token: write      # OIDC token for build-provenance attestation
      contents: write      # in order to create releases
      attestations: write
    name: Release smart-account Chimp
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@88068ec50cba931a96436869727ed08edeb76ade
    with:
      release_name: ${{ github.ref_name }}
      release_description: "Chimp Pocket smart account (per-card purse)"
      home_domain: 'nft.chimpdao.xyz'
      relative_path: 'contracts/smart-account'
      package: 'chimpdao-smart-account'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  release-smart-account-factory-contract:
    needs: approve-release
    permissions:
      id-token: write      # OIDC token for build-provenance attestation
      contents: write      # in order to create releases
      attestations: write
    name: Release smart-account-factory Chimp
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@88068ec50cba931a96436869727ed08edeb76ade
    with:
      release_name: ${{ github.ref_name }}
      release_description: "Chimp Pocket account factory"
      home_domain: 'nft.chimpdao.xyz'
      relative_path: 'contracts/smart-account-factory'
      package: 'chimpdao-smart-account-factory'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  release-chip-verifier-contract:
    needs: approve-release
    permissions:
      id-token: write      # OIDC token for build-provenance attestation
      contents: write      # in order to create releases
      attestations: write
    name: Release chip-verifier Chimp
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@88068ec50cba931a96436869727ed08edeb76ade
    with:
      release_name: ${{ github.ref_name }}
      release_description: "Chimp OZ Verifier for chip signatures"
      home_domain: 'nft.chimpdao.xyz'
      relative_path: 'contracts/chip-verifier'
      package: 'chimpdao-chip-verifier'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}
