[workspace]
members = ["contracts/*"]
resolver = "2"

[workspace.package]
authors = ["ChimpDAO"]
edition = "2024"
license = "BSD-3-Clause"
repository = "https://radicle.consulting-manao.com/z2BaY97Uo8HiE2MbcibmgpWpfas2D"

[workspace.dependencies.soroban-sdk]
version = "26.1.0"

[workspace.dependencies.chimpdao-chip-auth]
path = "contracts/chip-auth"

# Same OZ rev Nido pins (stellar-accounts on soroban-sdk 26).
[workspace.dependencies.stellar-accounts]
git = "https://github.com/OpenZeppelin/stellar-contracts.git"
rev = "637c53a8c4928fd0c71d330bd866f482c3454578"
package = "stellar-accounts"

[profile.release]
opt-level = "z"
debug = false
lto = true
debug-assertions = false
codegen-units = 1
panic = "abort"
overflow-checks = true
strip = true

[profile.release-with-logs]
debug-assertions = true
inherits = "release"
